<?xml version="1.0" encoding="UTF-8"?>
<!-- 動作確認用。A4 縦（210×297mm）。中心はリングの中心に合う。
     中心に小さな円（穴の回避の確認）、周りに正方形・円・曲線・折れ線、
     上端に「上」を示す三角、右下に transform 付きのグループ。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <g fill="none" stroke="#000" stroke-width="0.3">
    <!-- 中心を通る十字（中心の穴で切れるはず） -->
    <line x1="85" y1="148.5" x2="125" y2="148.5"/>
    <line x1="105" y1="128.5" x2="105" y2="168.5"/>
    <!-- 中心の小円（半径 4mm、穴の外） -->
    <circle cx="105" cy="148.5" r="4"/>
    <!-- 100mm の正方形と内接円 -->
    <rect x="55" y="98.5" width="100" height="100"/>
    <circle cx="105" cy="148.5" r="50"/>
    <!-- ベジエ曲線 -->
    <path d="M 30 60 C 60 20, 150 20, 180 60 S 120 100, 105 80"/>
    <!-- 多角形（閉じる） -->
    <polygon points="40,240 70,270 40,285 20,260"/>
    <!-- 上を示す三角（SVG の上 = リングの奥、α=180° 側） -->
    <path d="M 105 15 L 95 30 L 115 30 Z"/>
    <!-- transform 付きグループ -->
    <g transform="translate(150,230) rotate(30)">
      <rect x="-15" y="-10" width="30" height="20"/>
      <ellipse cx="0" cy="0" rx="12" ry="6"/>
    </g>
    <!-- 届かない範囲にかかる線（A4 の角に向かう） -->
    <line x1="105" y1="148.5" x2="205" y2="292"/>
  </g>
</svg>
